{% load siga %}<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block titulo %}SIGA{% endblock %} · ITS N.º 1</title>
  <link rel="icon" href="{% estatico 'img/favicon.svg' %}" type="image/svg+xml">
  <link rel="stylesheet" href="{% estatico 'css/siga.css' %}">
  {% block estilos %}{% endblock %}
</head>
<body>
  {% block cuerpo %}{% endblock %}

  {% for mensaje in messages %}
    <div class="toast {% if mensaje.level_tag == 'error' %}error{% endif %}" role="status">
      <i data-lucide="{% if mensaje.level_tag == 'error' %}circle-alert{% else %}circle-check{% endif %}"></i>
      <span>{{ mensaje }}</span>
    </div>
  {% endfor %}

  <script src="{% estatico 'vendor/lucide.min.js' %}"></script>
  <script src="{% estatico 'js/siga.js' %}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
