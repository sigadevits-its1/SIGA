name: siga

services:
  siga_db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-siga}
      POSTGRES_USER: ${POSTGRES_USER:-siga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configurar POSTGRES_PASSWORD en .env}
    volumes:
      - siga_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build: .
    restart: unless-stopped
    command: sh -c "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      DB_HOST: siga_db
    volumes:
      - ./src:/app
      - siga_media:/data/media
    ports:
      - "${SIGA_PORT:-8000}:8000"
    depends_on:
      siga_db:
        condition: service_healthy

volumes:
  siga_pgdata:
  siga_media:
